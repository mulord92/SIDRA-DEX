    <!-- Wallet Extension Redefinition Guard -->
    <script>
      (function() {
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'ethereum') {
              try {
                return origDefineProperty.call(this, obj, prop, descriptor);
              } catch (err) {
                console.warn('Handled injected wallet ethereum redefinition conflict:', err);
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return origDefineProperty.call(this, obj, prop, descriptor);
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && String(event.message).includes('Cannot redefine property: ethereum')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
